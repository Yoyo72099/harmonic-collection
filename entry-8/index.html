<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty 50th Anniversary Collaborations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff0f5;
            color: #333;
        }
        header {
            background-image: url('https://japanhousela.com/wp-content/uploads/2024/12/Hello-Kitty-50th_All-Characters.png');
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 4rem 2rem;
            position: relative;
        }
        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 107, 158, 0.6);
        }
        header h1, header p {
            position: relative;
            z-index: 1;
        }
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .filter {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            box-shadow: 0 2px 8px rgba(255, 107, 158, 0.2);
        }
        .filter label {
            font-weight: bold;
            margin-right: 1rem;
            color: #ff6b9e;
        }
        .filter select {
            padding: 0.5rem 1rem;
            border: 2px solid #ffccd5;
            border-radius: 4px;
            margin-right: 1rem;
            min-width: 150px;
        }
        .filter button {
            padding: 0.5rem 1.2rem;
            background: #ff6b9e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .filter button:hover {
            background: #ff4a90;
        }
        .brands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }
        .brand-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .brand-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(255, 107, 158, 0.2);
        }
        .brand-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .brand-info {
            padding: 1.2rem;
        }
        .brand-info h3 {
            color: #ff6b9e;
            margin: 0 0 0.5rem;
            font-size: 1.3rem;
        }
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            overflow-y: auto;
        }
        #modal-content {
            background: white;
            width: 90%;
            max-width: 700px;
            margin: 5% auto;
            padding: 2rem;
            border-radius: 8px;
            position: relative;
        }
        #close-modal {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #ff6b9e;
            transition: transform 0.2s;
        }
        #close-modal:hover {
            transform: scale(1.2);
        }
        #modal-brand-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 1.5rem;
        }
        .modal-brand-name {
            color: #ff6b9e;
            margin: 0 0 1rem;
            font-size: 1.8rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hello Kitty 50th Anniversary Collaborations</h1>
        <p>Celebrating five decades of cuteness with iconic brand partnerships</p>
    </header>

    <div class="container">
        <div class="filter">
            <label for="brand-filter">Filter by Brand:</label>
            <select id="brand-filter">
                <option value="all">All Brands</option>
                <option value="adidas">Adidas</option>
                <option value="crocs">Crocs</option>
                <option value="starbucks">Starbucks</option>
                <option value="kitsch">Kitsch</option>
                <option value="mcdonalds">McDonald's</option>
                <option value="uniqlo">Uniqlo</option>
                <option value="casio">Casio</option>
                <option value="gcds">GCDS</option>
            </select>
            <button onclick="filterBrands()">Show Results</button>
        </div>

        <div class="brands-grid" id="brands-container">
            <!-- Brands will be rendered dynamically -->
        </div>
    </div>

   
    <div id="modal">
        <div id="modal-content">
            <span id="close-modal" onclick="closeModal()">&times;</span>
            <img id="modal-brand-img" src="" alt="Brand collaboration image">
            <h2 class="modal-brand-name" id="modal-brand-name"></h2>
            <p id="modal-brand-desc"></p>
        </div>
    </div>

    <script>
        // 50th Anniversary collaboration data (removed products)
        const collaborations = [
            {
                brand: "adidas",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/b9f/765/3ec/fbacf9f77f1c9df7e959fc9x1024x699x280.png_1080_0_40_dbe9.png",
                brandDesc: "Adidas teams up with Hello Kitty for exclusive footwear series, available in both adult and kids' sizes."
            },
            {
                brand: "crocs",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/8cb/e28/812/de93ab03738c5804e63f807x1548x1024x1161.png_1080_0_40_08d3.png",
                brandDesc: "Iconic Crocs clogs get a cute Hello Kitty makeover with exclusive Jibbitz charms."
            },
            {
                brand: "starbucks",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/2d0/b36/4bc/98c2e432872e66ae3c67b30x1024x513x411.png_1080_0_40_5be8.png",
                brandDesc: "Limited edition drinkware celebrating Hello Kitty's 50th anniversary with retro-inspired designs."
            },
            {
                brand: "kitsch",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/536/36c/76b/01f332d8c4843ce87454d17x1188x1188x1223.png_1080_0_40_1e1b.png",
                brandDesc: "Popular Kitsch accessories expand to home goods with Hello Kitty's iconic style."
            },
            {
                brand: "mcdonalds",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/f04/a38/0e2/29fc3faa3d831dbbb6dc25fx640x901x725.png_1080_0_40_6ca8.png",
                brandDesc: "Happy Meal exclusive blind boxes featuring Hello Kitty's 50-year evolution."
            },
            {
                brand: "uniqlo",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/3ba/64f/5cc/082d799d6a9a4799be3db87x1200x675x1242.png_1080_0_40_85df.png",
                brandDesc: "Comfortable UT graphic tees with retro Hello Kitty designs for the whole family."
            },
            {
                brand: "casio",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/a74/eec/18d/a115146174e79b598ce7e6ex1280x850x778.png_1080_0_40_8f5a.png",
                brandDesc: "Durable Baby-G watch with cute Hello Kitty accents, perfect for everyday wear."
            },
            {
                brand: "gcds",
                brandImg: "https://imgcache.dealmoon.com/thumbimg.dealmoon.com/us2409/dealmoon/d3d/93c/336/18715efe9a2d635cf0efe87x1000x560x581.png_1080_0_40_5e9c.png",
                brandDesc: "Edgy streetwear collection blending GCDS's bold style with Hello Kitty's iconic image."
            }
        ];

        // Initialize page with all brands
        document.addEventListener("DOMContentLoaded", () => {
            renderBrands(collaborations);
            console.log("Total collaborating brands:", collaborations.length);
        });

        // Function to render brand cards (removed product count)
        function renderBrands(brands) {
            const container = document.getElementById("brands-container");
            container.innerHTML = "";

            for (let i = 0; i < brands.length; i++) {
                const brand = brands[i];
                const card = document.createElement("div");
                card.className = "brand-card";
                card.onclick = () => openModal(brand);

                const brandName = brand.brand.charAt(0).toUpperCase() + brand.brand.slice(1);

                card.innerHTML = `
                    <img src="${brand.brandImg}" alt="${brandName} x Hello Kitty">
                    <div class="brand-info">
                        <h3>${brandName}</h3>
                        <p>${brand.brandDesc}</p>
                    </div>
                `;

                container.appendChild(card);
            }
        }

        // Function to filter brands
        function filterBrands() {
            const selectedBrand = document.getElementById("brand-filter").value;
            let filteredBrands;

            if (selectedBrand === "all") {
                filteredBrands = collaborations;
            } else {
                filteredBrands = [];
                for (let brand of collaborations) {
                    if (brand.brand === selectedBrand) {
                        filteredBrands.push(brand);
                    }
                }
            }

            renderBrands(filteredBrands);
            return filteredBrands;
        }

        // Function to open modal (removed product list rendering)
        function openModal(brand) {
            const modal = document.getElementById("modal");
            const brandName = brand.brand.charAt(0).toUpperCase() + brand.brand.slice(1);
            
            document.getElementById("modal-brand-img").src = brand.brandImg;
            document.getElementById("modal-brand-name").textContent = `${brandName} x Hello Kitty`;
            document.getElementById("modal-brand-desc").textContent = brand.brandDesc;

            modal.style.display = "block";
        }

        // Function to close modal
        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        // Close modal when clicking outside
        window.onclick = (event) => {
            const modal = document.getElementById("modal");
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
